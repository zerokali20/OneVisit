version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: onevisit_postgres
    restart: always
    environment:
      POSTGRES_USER: onevisit_user
      POSTGRES_PASSWORD: onevisit_password
      POSTGRES_DB: onevisit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onevisit_user -d onevisit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onevisit_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://onevisit_user:onevisit_password@db:5432/onevisit_db
      PROJECT_NAME: OneVisit API
      VERSION: 1.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onevisit_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
